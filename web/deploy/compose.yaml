name: vera-prive
services:
  app:
    build:
      context: ..
    env_file: ../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      DATABASE_PATH: /app/data/accounts.sqlite
      APP_URL: https://shop.example.com
      TRUSTED_PROXY: 172.30.88.3/32
    restart: unless-stopped
    volumes:
      - accounts:/app/data
    networks:
      shop:
        ipv4_address: 172.30.88.2
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4173/api/shop-auth').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: '3'
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    networks:
      shop:
        ipv4_address: 172.30.88.3
    logging:
      options:
        max-size: 10m
        max-file: '3'
networks:
  shop:
    ipam:
      config:
        - subnet: 172.30.88.0/24
volumes:
  accounts:
  certificates:
  proxy_config:
